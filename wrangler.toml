name = "gen-architects"
main = "src/worker.tsx"
compatibility_date = "2024-12-01"

# Custom domain. The genarchitects.net zone must be active on this Cloudflare account.
[[routes]]
pattern = "genarchitects.net"
zone_name = "genarchitects.net"
custom_domain = true

# Static files are staged into ./dist by `pnpm build:assets`.
# Requests that match a file are served directly by Cloudflare; everything else
# falls through to the Hono Worker in src/worker.tsx.
[assets]
directory = "./dist"
binding = "ASSETS"

[observability.logs]
enabled = true
invocation_logs = true

[observability.traces]
enabled = true
destinations = ["genarchitects"]
head_sampling_rate = 1
persist = false

[[d1_databases]]
binding = "DB"
database_name = "gen-architects-db"
database_id = "46599ff7-3833-4c6c-9fa3-8da5507c80f1"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "gen-architects-media"
